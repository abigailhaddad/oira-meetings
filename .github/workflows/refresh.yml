name: Refresh OIRA meetings

# Wednesdays 13:00 UTC. Re-reads the previous month and this month from reginfo.gov (about 300 requests,
# 1.6 seconds apart), merges into the Hugging Face dataset, uploads only if something was added or changed.
# Needs the HF_TOKEN secret (write access to abigailhaddad/oira-eo12866-meetings). A failed run emails the owner.

on:
  schedule:
    - cron: "0 13 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - name: Re-read, merge, upload
        run: python scripts/refresh.py

      # Downloadable SQLite: download what is now on Hugging Face, stop if its columns no longer match
      # docs/tables.toml, build one SQLite file and attach it to the GitHub release `latest-data`. The release
      # is deleted and recreated whenever the Hugging Face commit changes, so it always holds one file.
      - name: SQLite file on the latest-data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/data_docs.py fetch hf_data
          python scripts/data_docs.py check hf_data
          sha=$(cat hf_data/REVISION)
          if gh release view latest-data --json body --jq .body 2>/dev/null | grep -q "$sha"; then
            echo "latest-data already holds Hugging Face commit $sha; nothing to do"
            exit 0
          fi
          built=$(python scripts/build_sqlite.py hf_data oira-eo12866-meetings.sqlite | tail -n 1)
          echo "$built"
          gh release delete latest-data --cleanup-tag --yes 2>/dev/null || true
          gh release create latest-data oira-eo12866-meetings.sqlite --title "Latest data (SQLite)" --notes "SQLite copy of https://huggingface.co/datasets/abigailhaddad/oira-eo12866-meetings at commit $sha, built $(date -u +%Y-%m-%d) by the weekly refresh workflow. One table per parquet file (meetings, attendees, documents); the handout files are not in it; columns are described in docs/data_dictionary.md. ${built#wrote }"

      # GitHub disables scheduled workflows in a public repo after 60 days with no commits.
      - name: Keepalive commit
        if: ${{ always() }}
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "newest commit is $age days old"
          if [ "$age" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive: no commits in $age days"
            git push
          fi
